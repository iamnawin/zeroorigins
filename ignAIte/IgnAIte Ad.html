<!DOCTYPE html>

<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IgnAIte Ad</title>
<link href="./IgnAIte Ad_files/css2" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: #111;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: 'DM Sans', sans-serif;
}

/* ── AD CARD — 9:16 ratio (1080x1920 equivalent) ── */
.ad {
  width: 420px;
  height: 748px;
  background: #080808;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
}

/* ── SPIRAL / TUNNEL BG ── */
.bg-visual {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 60px;
  opacity: 0.25;
  pointer-events: none;
}

.spiral {
  width: 340px;
  height: 340px;
  position: relative;
}

.spiral-ring {
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(139,92,246,0.6);
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
}

/* ── GRID OVERLAY ── */
.grid-bg {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(139,92,246,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(139,92,246,0.06) 1px, transparent 1px);
  background-size: 32px 32px;
  pointer-events: none;
}

/* ── TOP GLOW ── */
.top-glow {
  position: absolute;
  width: 300px; height: 200px;
  background: radial-gradient(ellipse, rgba(139,92,246,0.25) 0%, transparent 70%);
  top: -40px; left: 50%; transform: translateX(-50%);
  pointer-events: none;
}

/* ── BOTTOM GLOW ── */
.bottom-glow {
  position: absolute;
  width: 400px; height: 200px;
  background: radial-gradient(ellipse, rgba(139,92,246,0.12) 0%, transparent 65%);
  bottom: 80px; left: 50%; transform: translateX(-50%);
  pointer-events: none;
}

/* ── CONTENT ── */
.content {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 48px 36px 0;
  text-align: center;
  flex: 1;
}

/* ── TOP BADGE ── */
.top-badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: rgba(139,92,246,0.15);
  border: 1px solid rgba(139,92,246,0.3);
  border-radius: 100px;
  padding: 6px 16px;
  font-size: 11px;
  font-weight: 700;
  color: #A78BFA;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 28px;
}

.badge-dot {
  width: 6px; height: 6px;
  background: #8B5CF6;
  border-radius: 50%;
  box-shadow: 0 0 8px #8B5CF6;
}

/* ── HEADLINE ── */
.headline {
  font-family: 'DM Sans', sans-serif;
  font-weight: 900;
  font-size: 52px;
  line-height: 1.0;
  letter-spacing: -0.03em;
  color: #FFFFFF;
  margin-bottom: 0;
}

.headline .accent {
  color: #8B5CF6;
  display: block;
}

/* ── SUB HEADLINE ── */
.subline {
  font-size: 17px;
  color: rgba(255,255,255,0.45);
  margin-top: 14px;
  margin-bottom: 32px;
  font-weight: 400;
  line-height: 1.4;
}

/* ── CTA BUTTON ── */
.cta {
  background: #8B5CF6;
  color: #FFFFFF;
  font-family: 'DM Sans', sans-serif;
  font-weight: 800;
  font-size: 17px;
  padding: 16px 44px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  letter-spacing: 0.01em;
  box-shadow: 0 8px 32px rgba(139,92,246,0.45);
  position: relative;
  overflow: hidden;
  margin-bottom: 28px;
  transition: transform 0.2s;
  text-decoration: none;
  display: inline-block;
}

.cta::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 50%);
  pointer-events: none;
}

/* ── META ROW ── */
.meta {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 0;
}

.meta-item {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  color: rgba(255,255,255,0.4);
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.meta-icon { font-size: 14px; opacity: 0.6; }

.meta-divider {
  width: 1px; height: 16px;
  background: rgba(255,255,255,0.12);
}

/* ── STAMP ── */
.stamp {
  position: absolute;
  right: 24px;
  bottom: 160px;
  width: 76px; height: 76px;
  border: 2px solid rgba(255,255,255,0.5);
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  transform: rotate(12deg);
}

.stamp-text {
  font-size: 9px;
  font-weight: 800;
  color: rgba(255,255,255,0.8);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  text-align: center;
  line-height: 1.2;
}

/* ── BOTTOM VISUAL AREA ── */
.bottom-area {
  position: relative;
  z-index: 1;
  width: 100%;
  flex: 1;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  overflow: hidden;
}

/* ── TUNNEL ── */
.tunnel {
  width: 300px;
  height: 240px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0.2;
}

.ring {
  position: absolute;
  border-radius: 50%;
  border: 1px solid #8B5CF6;
}

/* figure at center */
.figure {
  position: absolute;
  bottom: 50%;
  left: 50%;
  transform: translateX(-50%);
  width: 6px; height: 14px;
  background: rgba(255,255,255,0.6);
  border-radius: 3px;
  z-index: 3;
}

/* ── BOTTOM URL STRIP ── */
.url-strip {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: #8B5CF6;
  padding: 14px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 10;
}

.url-text {
  font-weight: 800;
  font-size: 16px;
  color: #fff;
  letter-spacing: 0.01em;
}

.url-arrow {
  width: 32px; height: 32px;
  background: rgba(255,255,255,0.2);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  color: #fff;
}

</style>
</head>
<body>

<div class="ad">

      <div class="meta-item">

  </div>

  <!-- STAMP -->
  <div class="stamp">

  <div class="bottom-area">

</div>



</body></html>
